# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# TODO(student):
#   - Rewrite every description: what it does, WHEN to use it, WHEN NOT to use it.
#   - Spell out arg conventions in parameter descriptions (handle format, topic/timeframe, search_type).
#   - Make the `send` confirmation boundary explicit.
#   - Declare your new tool(s) at the end of this file.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng và chờ lượt trả lời tiếp theo. Dùng khi THIẾU thông tin bắt buộc (handle/URL/từ khoá) hoặc cần XÁC NHẬN một hành động ghi (gửi/đăng). KHÔNG đoán bừa khi thiếu dữ liệu — hãy hỏi lại."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi cần hỏi user."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text = hỏi thông tin còn thiếu; yes_no = xin xác nhận hành động ghi; choice = chọn trong 'options'."}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn khi response_type=choice."}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng/tweet gần đây CỦA MỘT tài khoản cụ thể. Dùng khi user nêu tên người/tài khoản. KHÔNG dùng cho chủ đề chung (đó là social_search)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle KHÔNG có '@', viết thường. Map tên: Sam Altman->sama, Elon Musk->elonmusk, Andrej Karpathy->karpathy."}
        limit: {type: integer, default: 5, description: "Số bài muốn lấy, lấy từ 'N tweet' mà user nói."}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng/tweet theo CHỦ ĐỀ hoặc từ khoá (không phải của một người). Dùng khi user hỏi 'mọi người nói gì về X'. KHÔNG dùng khi user muốn bài của MỘT người (đó là timeline)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khoá/chủ đề cần tìm."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Top = phổ biến/nổi bật/top; Latest = mới nhất."}
        limit: {type: integer, default: 5, description: "Số lượng kết quả."}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên web. topic='news' cho TIN TỨC/thời sự hiện tại; topic='general' cho kiến thức chung. KHÔNG dùng khi user đã đưa URL cụ thể (dùng fetch). Yêu cầu làm bản tin / tin tức luôn cần lookup, kể cả khi user muốn kiểm tra thêm policy: gọi cả hai trong cùng lượt."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "CHỈ từ khoá lõi (vd 'AI'). KHÔNG nhồi 'news/tin tức/hôm nay' vào query — thời điểm dùng timeframe, loại dùng topic."}
        topic: {type: string, enum: [general, news], default: "general", description: "news = tin tức/thời sự; general = kiến thức chung. Tin AI hôm nay -> topic=news."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day=hôm nay, week=tuần này, month=tháng này, year=năm nay."}
        max_results: {type: integer, default: 5, description: "Số kết quả."}
      required: [query]

  - name: fetch
    description: "Đọc nội dung từ một URL cụ thể. CHỈ dùng khi user đã đưa link rõ ràng. KHÔNG dùng để tìm kiếm chung (đó là lookup)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Link đầy đủ user đã đưa."}
      required: [url]

  - name: format
    description: "Trình bày danh sách item ĐÃ CÓ thành văn bản/digest. CHỈ dùng khi đã có items; KHÔNG tự đi lấy dữ liệu mới."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã thu thập (title/url/source/summary/section)."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn trình bày: brief, sections, bullets, thread, daily_ai_vn."}
        headline: {type: string, default: "", description: "Tiêu đề cho bản trình bày."}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi text lên Telegram channel (HÀNH ĐỘNG ghi). CHỈ gọi sau khi user ĐÃ xác nhận. Nếu chưa xác nhận, gọi clarify(response_type='yes_no') trước; khi user đồng ý mới gọi send với confirmed=true."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung gửi."}
        confirmed: {type: boolean, default: false, description: "true CHỈ khi user đã đồng ý gửi."}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu/chính sách nội bộ của công ty. Dùng khi user hỏi về quy định/nội quy/nguyên tắc nội bộ; KHÔNG dùng cho tin tức hay kiến thức chung."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn nội dung cần tìm."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm chính sách cần tra."}
        top_k: {type: integer, default: 3, description: "Số mục lấy ra."}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học trên arXiv. Dùng khi user hỏi về paper/nghiên cứu học thuật; KHÔNG dùng cho tin tức thời sự (đó là lookup topic=news)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khoá bài báo."}
        max_results: {type: integer, default: 5, description: "Số lượng bài báo."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp: relevance, lastUpdatedDate, submittedDate."}
      required: [query]

  - name: paper_text
    description: "Tải và trích text của MỘT bài báo arXiv. Dùng khi đã có arxiv_url/ID cụ thể và cần nội dung chi tiết; KHÔNG dùng để tìm bài báo (đó là papers)."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc URL bài báo arXiv."}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa."}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa."}
      required: [arxiv_url]

  # ---------------- Team tools (v3, Role C) ----------------
  # Appended at the end on purpose: Role B owns the body above.
  - name: rank_items
    description: "Khử trùng lặp và xếp hạng danh sách item ĐÃ CÓ (kết quả từ lookup, social_search, papers... hoặc danh sách user dán vào). Dùng khi đã có items và user muốn bỏ trùng, lọc top N, xếp theo mới nhất / điểm cao / độ liên quan. KHÔNG lấy dữ liệu mới (gọi lookup/social_search/papers trước). KHÔNG dùng để trình bày bản tin (dùng format)."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã thu thập, giữ nguyên các trường từ tool trước."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              summary: {type: string}
              date: {type: string}
              score: {type: number}
        sort_by: {type: string, enum: [recency, relevance, score], default: "recency", description: "recency = mới nhất; score = điểm/lượt tương tác cao nhất ('nổi bật', 'hot'); relevance = khớp từ khóa (bắt buộc kèm query)."}
        query: {type: string, default: "", description: "Từ khóa, chỉ cần khi sort_by=relevance."}
        dedupe: {type: boolean, default: true, description: "Bỏ item trùng url/title."}
        top_k: {type: integer, default: 10, description: "Giữ tối đa bao nhiêu item. Lấy đúng con số user nói ('top 3' = 3)."}
      required: [items]

  - name: wiki
    description: "Tra kiến thức nền ổn định trên Wikipedia: khái niệm, người, tổ chức, sự kiện ('X là gì', 'giới thiệu về Y', 'Y là ai'). KHÔNG dùng cho tin tức hay thông tin mới/gần đây (dùng lookup topic=news). KHÔNG dùng cho bài toán, tính toán hay viết code (ngoài phạm vi: không gọi tool)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Tên khái niệm/người/tổ chức cần tra, ngắn gọn. Ví dụ: 'Transformer deep learning', 'Geoffrey Hinton'."}
        lang: {type: string, enum: [en, vi], default: "en", description: "Ngôn ngữ của Wikipedia, KHÔNG phải ngôn ngữ của câu hỏi. Luôn dùng en (đầy đủ và chính xác hơn), kể cả khi user hỏi bằng tiếng Việt. Chỉ dùng vi khi user nói rõ 'Wikipedia tiếng Việt' / 'nguồn tiếng Việt'."}
        sentences: {type: integer, default: 5, description: "Số câu tóm tắt, 1-10."}
      required: [query]

  - name: github_repo
    description: "Lấy thông tin MỘT repository GitHub: số star, fork, issue, ngôn ngữ, license, topics, lần push cuối, có bị archive không. Dùng khi user hỏi về một repo / thư viện / dự án open-source cụ thể ('repo X bao nhiêu star', 'còn được maintain không', 'license gì'). KHÔNG dùng để đọc README hay code (dùng fetch với URL repo). KHÔNG dùng cho model AI trên Hugging Face (dùng hf_models)."
    parameters:
      type: object
      properties:
        repo: {type: string, default: "", description: "Ưu tiên dạng 'owner/name' (vd 'langchain-ai/langchain', 'ollama/ollama') hoặc URL github.com. Chỉ truyền tên trống (vd 'langchain') khi thật sự không biết owner."}
      required: [repo]

  - name: hf_models
    description: "Tìm model AI open-weight trên Hugging Face Hub, hoặc xem chi tiết một model: lượt tải (30 ngày), like, license, loại task, paper arXiv liên quan. Dùng khi user hỏi về model trên Hugging Face / model open-source ('model nào phổ biến cho task X', 'Qwen3 bao nhiêu lượt tải', 'license của Llama'). KHÔNG dùng cho paper (dùng papers) và KHÔNG dùng cho repo code GitHub (dùng github_repo)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm model, vd 'qwen', 'whisper'. Bỏ trống nếu đã có model_id."}
        model_id: {type: string, default: "", description: "Id chính xác dạng 'org/name' (vd 'meta-llama/Llama-3.1-8B-Instruct') khi user hỏi về MỘT model cụ thể."}
        task: {type: string, default: "", description: "Lọc theo task của Hugging Face, vd 'text-generation', 'automatic-speech-recognition', 'text-to-image'."}
        sort_by: {type: string, enum: [downloads, likes, trending, recent], default: "downloads", description: "downloads = phổ biến nhất; likes = được yêu thích nhất; trending = đang hot; recent = mới nhất."}
        limit: {type: integer, default: 5, description: "Số model, 1-20. Lấy đúng con số user nói."}
      required: []
